name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月1日 UTC 00:00，防止 GitHub 60天不活跃停用 workflows
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep workflows active
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
